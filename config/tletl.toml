# Tletl v5 — parámetros en un solo lugar.
# Todo override por variable de entorno tiene prioridad sobre este archivo
# (ver tletl_core/config.py: ENV_MAP). Las rutas vacías ("") usan el default
# de tletl_core/paths.py (todo el runtime vive en ~/.tletl/).

[classifier]
k = 13                      # vecinos KNN          (env: TLETL_AI_V47_K)
orientation_weight = 0.45   # peso de features de orientación (env: TLETL_AI_V47_ORIENTATION_WEIGHT)
strict = true               # aplicar umbrales internos de confianza/margen
min_confidence = 0.47       # por debajo -> NEUTRAL
min_margin = 0.18           # margen mínimo entre top-1 y top-2

[guard]
# Cruce IA (KNN) vs regla geométrica. Si se contradicen en un gesto peligroso
# y la IA no está segura, se bloquea a NEUTRAL.
enabled = true
conf_threshold = 0.55       # IA debe superar esto para imponerse sobre la regla
margin_threshold = 0.20
dangerous = ["PINCH", "POINT", "VICTORY", "THREE", "FIST"]

[critic]
# Crítico estricto: umbral de confianza por gesto + validación de orientación.
enabled = true
require_orientation = true

[critic.min_conf]
# Confianza mínima por gesto. Solo hace falta poner los que cambies.
# PINCH bajó de 0.72 a 0.62 (validación 2026-07-02: de día el KNN acierta PINCH
# con 0.62–0.70 y el critic lo mataba). Si ves pinzas fantasma, súbelo.
OPEN_PALM = 0.70
FIST = 0.68
POINT = 0.69
VICTORY = 0.72
PINCH = 0.62
THREE = 0.72
NEUTRAL = 0.55

[temporal]
size = 7                    # tamaño de la ventana de historia por mano
min_count = 4               # cuántas repeticiones para fijar un gesto

[lowlight]
enabled = true              # CLAHE + gamma adaptativo antes de MediaPipe (env: TLETL_LOWLIGHT)
clip_limit = 2.0
gamma_dark = 1.6            # gamma del modo más oscuro; los intermedios se derivan de este

[adaptive]
enabled = false             # APRENDIZAJE EN VIVO — OFF por default (env: TLETL_ADAPTIVE)
min_confidence = 0.78       # solo aprende si supera esto
max_samples_per_gesture = 120
path = ""                   # "" => ~/.tletl/tletl_adaptive_runtime.json (env: TLETL_ADAPTIVE_PATH)
save_interval = 2.0         # segundos mínimos entre escrituras a disco

[fedora]
dominant_hand = "Right"     # mano que controla Fedora; la otra va al bus (env: TLETL_DOMINANT_HAND)
dry_run = false             # true => imprime acciones sin ejecutar ydotool (env: TLETL_DRY_RUN)
safety_hold = 0.35          # segundos de FIST estable antes de pausar (evita puños fantasma al agarrar cosas)
tap_max = 0.35              # CURSOR: PINCH más corto que esto = click
drag_min = 0.40             # CURSOR: PINCH más largo que esto = arrastre
action_conf = 0.52          # confianza mínima del KNN para ejecutar una acción

[bus]
path = ""                   # "" => ~/.tletl/tletl_state.json (env: TLETL_STATE_PATH). Blender lee la MISMA ruta.
include_features = false    # true => cada mano lleva sus ~60 features (triplica el JSON)
udp_target = ""             # "host:puerto" para publicar cada frame por UDP (AutoCAD en Windows). env: TLETL_BUS_UDP

[blender]
bus_path = ""               # LEGACY: alias de [bus].path. La ganancia/suavizado viven en las prefs del addon.

[camera]
index = 0                   # (env: TLETL_CAMERA)
width = 1280
height = 720
fps = 30
max_num_hands = 2
proc_width = 640            # ancho al que se reduce el frame para el detector (0 = sin reducir)
headless = false            # true => sin ventana OpenCV (para alimentar solo el bus). env: TLETL_HEADLESS

[tracker]
# Detector de manos. "auto" = MediaPipe Hand Landmarker (Tasks API) como
# principal (aprobado 2026-09-30); cae a "legacy" (mp.solutions) solo si Tasks
# no está disponible. "tasks" o "legacy" lo fuerzan. env: TLETL_TRACKER_BACKEND
backend = "auto"
model_path = ""             # ruta a hand_landmarker.task ("" => ~/.tletl/models/hand_landmarker.task). env: TLETL_TRACKER_MODEL
auto_download = true        # si falta el .task, lo descarga una vez (~8 MB) en vez de tronar. env: TLETL_TRACKER_AUTO_DOWNLOAD
det_conf = 0.72
track_conf = 0.72
model_complexity = 1        # solo backend legacy (0, 1, 2)
gesture_hint = false        # segunda opinión con gesture_recognizer.task (FIST/OPEN_PALM/POINT/VICTORY). env: TLETL_GESTURE_HINT

[paths]
bank = ""                   # "" => datasets/tletl_gesture_bank_v2_features.jsonl (env: TLETL_GESTURE_BANK)
